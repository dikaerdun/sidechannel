function vec(a){return '['+a.join(', ')+']';}
function poly(a){let terms=[];a.forEach((v,i)=>{if(!v)return;const abs=Math.abs(v);let t=(abs===1&&i>0?'':abs)+(i===0?'':i===1?'x':`x<sup>${i}</sup>`);terms.push((terms.length?(v<0?' − ':' + '):(v<0?'−':''))+t);});return terms.join('')||'0';}
function status(ok,yes,no){return `<div class="result-status ${ok?'':'bad'}">${ok?'✓':'!'} ${ok?yes:no}</div>`;}
function sourceLinks(extra=''){return `<div class="sources">依据：<a href="https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.203.pdf" target="_blank" rel="noopener">NIST FIPS 203 ↗</a>${extra}</div>`;}
function note(title,body,warn=false){return `<aside class="note ${warn?'warning':''}"><h3>${title}</h3><p>${body}</p></aside>`;}
function details(title,body,open=false){return `<details ${open?'open':''}><summary>${title}</summary><div class="detail-body">${body}</div></details>`;}
function slider(id,label,value,min,max,step=1){return `<div class="slider-control"><label for="${id}">${label}</label><output id="${id}Val" for="${id}">${value}</output><input id="${id}" type="range" min="${min}" max="${max}" value="${value}" step="${step}"></div>`;}
function num(id,label,value,min,max){return `<label class="num-field" for="${id}"><span>${label}</span><input id="${id}" type="number" step="1" min="${min}" max="${max}" value="${value}" inputmode="numeric"></label>`;}
function table(headers,rows,cls=''){return `<div class="table-wrap"><table class="${cls}"><thead><tr>${headers.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function player(){return `<div class="progress" aria-hidden="true"><span id="stepProgress"></span></div><div class="player"><button type="button" data-act="prev" id="prevBtn" aria-label="上一步">← 上一步</button><button type="button" data-act="play" id="playBtn" class="primary">▶ 播放</button><button type="button" data-act="next" id="nextBtn">下一步 →</button><button type="button" data-act="reset">重置</button><label class="sr-only" for="speed">播放速度</label><select id="speed"><option value="2000">慢速</option><option value="1200" selected>正常</option><option value="600">快速</option></select><span class="step-counter" id="stepCount"></span></div>`;}
function stop(){clearInterval(state.timer);state.timer=null;state.playing=false;syncPlayer();}
function syncPlayer(){if(!$('playBtn'))return;const n=state.steps[state.lesson]||0,max=maxSteps[state.lesson]||1;$('playBtn').textContent=state.playing?'Ⅱ 暂停':'▶ 播放';$('prevBtn').disabled=n===0;$('nextBtn').disabled=n>=max;$('stepCount').textContent=n+' / '+max;$('stepProgress').style.width=(n/max*100)+'%';$('speed').value=state.speed;}
function play(){if(state.playing){stop();return;}if(state.steps[state.lesson]>=maxSteps[state.lesson])state.steps[state.lesson]=0;state.playing=true;updateLab();state.timer=setInterval(()=>{state.steps[state.lesson]++;updateLab();if(state.steps[state.lesson]>=maxSteps[state.lesson])stop();},state.speed);syncPlayer();}
function setStep(n){stop();state.steps[state.lesson]=Math.max(0,Math.min(maxSteps[state.lesson],n));updateLab();}
function navigate(){stop();let id=location.hash.replace('#','');if(!lessons.some(l=>l.id===id))id='start';state.lesson=id;document.title=lessons.find(l=>l.id===id).nav+' · ML-KEM 交互课堂';render();}
function render(){
 const i=lessons.findIndex(l=>l.id===state.lesson),l=lessons[i];
 $('lessonNav').innerHTML=lessons.map((x,j)=>`<a class="nav-link" href="#${x.id}" ${x.id===l.id?'aria-current="page"':''}><span class="nav-num">${String(j+1).padStart(2,'0')}</span>${x.nav}</a>`).join('');
 $('mobileNav').innerHTML=lessons.map((x,j)=>`<option value="${x.id}" ${x.id===l.id?'selected':''}>${String(j+1).padStart(2,'0')} · ${x.nav}</option>`).join('');
 $('lesson').innerHTML=`<header class="lesson-header"><div class="eyebrow">交互课程 / ${String(i+1).padStart(2,'0')} <span>${l.tag}</span></div><h1>${l.title}</h1><p class="lead">${l.lead}</p></header><p id="inputWarning" class="error-message" hidden role="alert"></p>${bodies[l.id]?bodies[l.id]():extra.body(l.id)}<footer class="next-lesson">${i?`<a href="#${lessons[i-1].id}">← ${lessons[i-1].nav}</a>`:'<span>让理解随着每一步计算发生。</span>'}${i<lessons.length-1?`<a href="#${lessons[i+1].id}">${lessons[i+1].nav} →</a>`:'<a href="#overview">回到课程起点 ↑</a>'}</footer>`;
 const presetSelectors={scalarPreset:'scalar',polyPreset:'poly',nttPreset:'ntt'};
 for(const [id,key] of Object.entries(presetSelectors))if($(id))$(id).value=state.presets[key];
 if($('budgetOp'))$('budgetOp').value=state.budget.op;
 updateLab();
}
const bodies={
overview:()=>`<section class="surface"><div class="lab-top"><span class="lab-title">一轮密钥封装</span>${tag('重点观察：网络上传什么')}</div><div id="labOutput" aria-live="polite"></div>${player()}</section><div class="explain"><article class="prose"><h2>它解决的是“建立共享秘密”</h2><p>ML-KEM 的全称是<strong>基于模格的密钥封装机制</strong>。双方经公开信道交互，最后得到同一份 32 字节的秘密 K。秘密 K 本身不用在网络上传输。</p><p>与“用公钥加密一份文件”不同，封装接口自行产生密钥材料。业务内容通常交给对称认证加密；身份绑定、会话上下文和密钥确认由完整协议处理。</p>${sourceLinks('<a href="https://csrc.nist.gov/pubs/sp/800/227/final" target="_blank" rel="noopener">NIST SP 800-227 ↗</a>')}</article>${note('先记住三个对象','ek 是公开的封装公钥；c 是公开的封装密文；K 是双方留在本地的共享秘密。ML-KEM 不会自动证明公钥属于谁，也不自动提供前向安全。')}</div>${details('为什么需要后量子算法？','足够大的容错量子计算机能利用 Shor 算法攻击整数分解和离散对数，影响 RSA、传统 DH 和 ECC。ML-KEM 的安全性与 Module-LWE 困难性有关，目前没有已知高效的经典或量子破解方法。它运行在普通计算机上，无须量子信道；“抗量子”也不是对未来所有攻击的绝对保证。')}`,
noise:()=>`<section class="surface"><div class="lab-top"><span class="lab-title">消息 + 噪声 → 解密落点 → 比特判决</span>${tag('精确舍入判决',true)}</div><div class="grid-lab"><div><p class="small muted">要恢复的消息比特</p><div class="segmented"><button data-act="noise-bit" data-value="0" aria-pressed="${state.noise.m===0}">比特 0</button><button data-act="noise-bit" data-value="1" aria-pressed="${state.noise.m===1}">比特 1</button></div>${slider('noiseAmount','总噪声 ε',state.noise.e,-8,8)}<p class="hint">先尝试 ε = −2，再把 ε 改成 +4。为什么同一噪声对两个比特的结果可能不同？</p><div class="controls"><button data-act="noise-example" data-value="-2">正常示例 −2</button><button data-act="noise-example" data-value="4">边界示例 +4</button></div><div id="noiseNumbers"></div></div><div id="labOutput" aria-live="polite"></div></div></section><section class="surface below"><h2>再算一个模运算</h2><div class="controls"><label for="modInput">整数 x</label><input id="modInput" type="number" value="${state.noise.x}" min="-10000" max="10000" step="1"><span id="modResult" class="formula"></span></div><p class="hint">这里统一显示 0～16 的非负剩余。负数并不非法，它可以与某个正数表示同一个剩余类。</p></section><div class="explain"><article class="prose"><h2>解密不是把噪声清零</h2><p>消息编码为 0 或 9。解密把大的矩阵乘积消掉，留下 <span class="mono">w = μ + ε (mod 17)</span>。只要还落在正确的判决区域，就能恢复消息。</p><p>精确规则为 <span class="mono">round(2w/17) mod 2</span>，这里按标准的向最近整数舍入规则。5～12 判为 1；0～4、13～16 判为 0。</p></article>${note('为什么不直接比较整数距离？','15 在模 17 中等于 −2，实际上靠近 0。奇数模数与舍入会造成边界不对称；“靠近编码中心”是直觉，正式计算必须使用 Compress₁。')}</div>${details('安全性与正确性为什么需要平衡？','公钥噪声帮助形成计算困难的问题，但噪声过大会让诚实通信也判错。实际参数由维度、模数、秘密与误差分布、压缩精度共同确定。本实验自由调节的是总误差，不代表可以随意修改真实 ML-KEM 的噪声分布或用这个小参数提供安全性。')}`,
scalar:()=>`<section class="surface"><div class="lab-top"><span class="lab-title">q = 17 · 可编辑的完整算例</span>${tag('教学模型',true)}</div><div class="controls"><label for="scalarPreset">计算预设</label><select id="scalarPreset"><option value="custom" disabled>自定义输入</option><option value="original">原课件：恢复比特 1</option><option value="zero">跨过 0：恢复比特 0</option><option value="edge">接近判决边缘</option><option value="fail">噪声跨界：解密失败</option></select></div><div class="form-grid">${[['a','a · 公开',0,16],['s','s · 秘密',-4,4],['e','e · 公钥噪声',-5,5],['r','r · 临时秘密',-4,4],['e1','e₁',-5,5],['e2','e₂',-6,6],['m','消息比特 m',0,1]].map(([k,l,min,max])=>num('scalar-'+k,l,state.scalar[k],min,max)).join('')}</div><div id="labOutput" aria-live="polite"></div>${player()}</section><div class="explain"><article class="prose"><h2>先追踪依赖，再追踪数值</h2><p>t 依赖秘密 s 与噪声 e；加密方拿到 t 后，再使用本次的小随机量 r、e₁、e₂ 构造 u、v。解密者只需自己的 s，就能算出 <span class="mono">v − su</span>。</p><p>不知道噪声，不妨碍消掉大项。剩余误差 <span class="mono">er + e₂ − se₁</span> 由多组小量组合而来，不能只看某一个 e 的大小。</p></article>${note('这个模型刻意省略了什么？','只有一个整数秘密，没有向量、多项式、压缩与完整 KEM 安全变换。它没有实际密码安全性。“r”在这里是小数值，不是标准 Encrypt 输入的 32 字节随机种子。',true)}</div>${details('展开全部代数关系','<div class="formula">t = as + e<br>u = ar + e₁<br>v = tr + e₂ + μ<br>v − su = (as + e)r + e₂ + μ − s(ar + e₁)<br>= <span class="cancel">asr − sar</span> + er + e₂ − se₁ + μ<br>= μ + ε (mod q)</div>')}`,
polynomial:()=>`<section class="surface"><div class="lab-top"><span class="lab-title">R = ℤ₁₇[x] / (x⁴ + 1)</span>${tag('按常数项、x、x²、x³ 排列',true)}</div><div class="controls"><label for="polyPreset">乘法示例</label><select id="polyPreset"><option value="custom" disabled>自定义输入</option><option value="hand">手算：(1 + 2x)(3 + x)</option><option value="fold">折回：(1 + x³)(1 + x)</option><option value="single">x³ × x²</option><option value="dense">四个系数都参与</option></select></div><div class="grid2 below"><div><h3>a(x)</h3><div class="coef-entry">${state.poly.a.map((v,i)=>`<label for="poly-a-${i}">a${i}<input id="poly-a-${i}" type="number" min="-16" max="16" step="1" value="${v}"></label>`).join('')}</div></div><div><h3>b(x)</h3><div class="coef-entry">${state.poly.b.map((v,i)=>`<label for="poly-b-${i}">b${i}<input id="poly-b-${i}" type="number" min="-16" max="16" step="1" value="${v}"></label>`).join('')}</div></div></div><div id="labOutput" aria-live="polite"></div>${player()}</section><div class="explain"><article class="prose"><h2>“折回”就是负循环卷积</h2><p>先按普通多项式相乘，把每对系数的乘积放在次数 i + j 对应的位置。若次数超过 3，就利用 <span class="mono">x⁴ = −1</span> 折回：次数减 4，符号变负。</p><p>本页特意不在每次加法后取模，让您看清整数贡献如何累加；最终每个系数再模 17。与每一步及时约简的结果等价。</p></article>${note('真实 ML-KEM 如何升级？','把 4 个系数换成 256 个，把模数 17 换成 3329，折回规则变成 x²⁵⁶ = −1。加法仍是逐系数相加，乘法仍然是负循环卷积。')}</div>${sourceLinks()}`,
module:()=>`<section class="surface"><div class="lab-top"><span class="lab-title">A 是 2 × 2 矩阵；每个元素都是 4 系数多项式</span>${tag('省略外层 KEM 的代数实验',true)}</div><div class="controls"><label for="moduleCompression">压缩对照</label><select id="moduleCompression"><option value="none" ${state.module.mode==='none'?'selected':''}>先不压缩</option><option value="mild" ${state.module.mode==='mild'?'selected':''}>dᵤ = 4，dᵥ = 3</option><option value="strong" ${state.module.mode==='strong'?'selected':''}>dᵤ = 3，dᵥ = 3</option><option value="cancel" ${state.module.mode==='cancel'?'selected':''}>dᵤ = 3，dᵥ = 2</option></select></div><div class="controls below"><span class="small">消息位（点击切换）</span>${state.module.m.map((v,i)=>`<button data-act="module-bit" data-value="${i}" id="moduleBit${i}" aria-label="切换消息第${i}位，当前为${v}">${v}</button>`).join('')}</div><div id="labOutput" aria-live="polite"></div>${player()}</section><div class="explain"><article class="prose"><h2>维度升级，抵消关系保持不变</h2><p><span class="mono">t = As + e</span>，因此加密时使用 <span class="mono">u = Aᵀr + e₁</span>，注意转置。这样 <span class="mono">(As)ᵀr = sᵀAᵀr</span> 才能精确抵消。</p><p>本例 n = 4、k = 2。真实参数里 n 固定为 256，k 取 2、3、4；“768”对应 256 × 3，不是共享秘密位数。</p></article>${note('增加压缩后，还会发生什么？','解压误差 δᵤ、δᵥ 会让最终噪声增加 δᵥ − sᵀδᵤ。试比较两种 dᵥ：单个样本的误差可能相互抵消，所以一次成功或失败不能代表总体失败概率。')}</div><div id="moduleAllDetails"></div>${sourceLinks()}`,
compression:()=>`<section class="surface"><div class="lab-top"><span class="lab-title">Compress / Decompress · q = 3329</span>${tag('真实算术规则')}</div><div class="grid-lab"><div>${slider('compressX','输入系数 x',state.compression.x,0,3328)}${slider('compressD','压缩位数 d',state.compression.d,1,11)}<div class="controls"><button data-act="compress-preset" data-x="1665" data-d="1">消息编码</button><button data-act="compress-preset" data-x="1234" data-d="4">v 的 4 比特</button><button data-act="compress-preset" data-x="1234" data-d="10">u 的 10 比特</button><button data-act="compress-preset" data-x="3328" data-d="4">回绕到 0</button></div></div><div id="labOutput" aria-live="polite"></div></div><div id="compressionFormula"></div></section><div class="explain"><article class="prose"><h2>压缩是量化，编码是打包</h2><p>先将模 3329 的整数缩放到 2ᵈ 个格点，按规定舍入，得到 d 比特整数；解压再映射回近似的系数。<strong>ByteEncode</strong> 负责把这些整数装成字节串，与有损压缩是两件事。</p><p>误差按模 q 的有符号代表计算。x = 3328 被重构成 0 时，两者只差 +1，而不是损失 3328。</p></article>${note('消息编码的精确数值','m 的每一位通过 Decompress₁ 映射：0 → 0，1 → 1665。解密再通过 Compress₁ 判位。不能用普通整数截断把 1 编成 1664。')}</div><section class="surface below"><h2>这些位数怎样变成密文大小？</h2>${table(['参数集','k','dᵤ / dᵥ','密文字节'],[['ML-KEM-512','2','10 / 4','32 × (10 × 2 + 4) = 768'],['ML-KEM-768','3','10 / 4','32 × (10 × 3 + 4) = 1088'],['ML-KEM-1024','4','11 / 5','32 × (11 × 4 + 5) = 1568']])}<p class="hint">u 有 k × 256 个系数，v 有 256 个系数，因此总长度 = (k × 256 × dᵤ + 256 × dᵥ) / 8。</p></section>${sourceLinks()}`,
ntt:()=>`<section class="surface"><div class="lab-top"><span class="lab-title">q = 17，n = 8，ω = 2（阶为 8）</span>${tag('循环 NTT 教学模型',true)}</div><div class="controls"><label for="nttPreset">输入预设</label><select id="nttPreset"><option value="ramp">[1,2,3,4,5,6,7,8]</option><option value="impulse">[1,0,0,0,0,0,0,0]</option><option value="pair">[1,1,0,0,0,0,0,0]</option></select><button data-act="ntt-direction" id="nttDirection">查看逆变换</button></div><div id="labOutput" aria-live="polite"></div>${player()}</section><div class="explain"><article class="prose"><h2>一次蝶形，只做乘、加、减</h2><p>取一对数 u、v，先算 <span class="mono">t = ζv mod q</span>，再输出 <span class="mono">u + t</span> 与 <span class="mono">u − t</span>。不同位置使用不同旋转因子 ζ。</p><p>本例先做位反转排列，再经过长度 2、4、8 三层蝶形。逆变换换成 ω⁻¹，并在最后乘 n⁻¹；全程精确，不使用浮点近似。</p></article>${note('这不是直接复制到 ML-KEM 的 NTT','本例是模 x⁸ − 1 的循环变换。ML-KEM 工作在 x²⁵⁶ + 1；模 3329 没有阶为 512 的本原单位根，所以只分解到 128 个二次小块。',true)}</div><div id="nttProduct" class="below"></div><section class="surface below"><h2>真实 ML-KEM 为什么保留两个系数？</h2><div class="formula-box"><div class="formula">3329 − 1 = 13 × 256<br>(a₀ + a₁x)(b₀ + b₁x) mod (x² − γ)<br>= (a₀b₀ + γa₁b₁) + (a₀b₁ + a₁b₀)x</div></div><p>标准做 7 层蝶形，末端使用 128 次二系数块乘法，不是 256 个完全独立的标量相乘。“不完全”指未拆到一次因子，不是精度损失。</p></section>${sourceLinks()}`,
kem:()=>`<section class="surface"><div class="lab-top"><span class="lab-title">浏览器里的真实密钥封装</span>${tag('使用实际 ML-KEM 算法')}</div><div class="controls"><label for="realLevel">参数集</label><select id="realLevel"><option value="512" ${state.real.level===512?'selected':''}>ML-KEM-512</option><option value="768" ${state.real.level===768?'selected':''}>ML-KEM-768</option><option value="1024" ${state.real.level===1024?'selected':''}>ML-KEM-1024</option></select><label for="realMode">随机输入</label><select id="realMode"><option value="random" ${state.real.mode==='random'?'selected':''}>每次新生成</option><option value="fixed" ${state.real.mode==='fixed'?'selected':''}>公开固定课堂种子</option></select></div><div class="controls below"><button data-act="real-keygen" class="primary">1 生成密钥</button><button data-act="real-encaps" id="encapsBtn">2 封装</button><button data-act="real-decaps" id="decapsBtn">3 解封装</button><button data-act="real-all" class="primary">运行完整流程</button><button data-act="real-reset">清空</button></div><div id="labOutput" aria-live="polite"></div><section class="below"><h3>篡改实验：只翻转密文的一位</h3><div class="controls"><label for="tamperOffset">字节位置</label><input id="tamperOffset" type="number" min="0" max="1087" value="${state.real.offset}" step="1"><label for="tamperBit">位</label><select id="tamperBit">${Array.from({length:8},(_,i)=>`<option value="${i}" ${i===state.real.bit?'selected':''}>${i}</option>`).join('')}</select><button data-act="real-tamper" id="tamperBtn" class="danger">翻转并解封装</button><button data-act="real-malformed" id="malformedBtn">试试错误长度</button><button data-act="real-restore" id="restoreBtn">恢复原密文</button></div><div id="tamperOutput"></div></section></section><div class="explain"><article class="prose"><h2>这次加密的不是用户业务明文</h2><p>Encaps 内部产生 32 字节随机消息 m，再计算 <span class="mono">(K,r_seed) = G(m ∥ H(ek))</span>。K 留在本地；r_seed 驱动内部 K-PKE.Encrypt 生成密文 c。</p><p>Decaps 先恢复 m′，再派生 K′ 与 r′_seed，重新加密得到 c′。若与收到的 c 不一致，选择 <span class="mono">J(z ∥ c)</span>。</p></article>${note('这是学习实验，不是密钥管理产品','浏览器会显示教学所需的随机输入和密钥材料，请勿在此输入实际密钥。固定课堂种子是公开测试数据；本演示不声称生产环境或侧信道安全。',true)}</div>${details('KeyGen：完整私钥为什么比 s 大？','<div class="formula">(ρ,σ) = G(d ∥ byte(k))<br>ek = Encode(t̂) ∥ ρ<br>dk = dk_PKE ∥ ek ∥ H(ek) ∥ z</div><p>d 和 z 各 32 字节。dk 包含重新加密需要的公钥、绑定公钥的哈希与拒绝值 z。界面显示的是标准展开私钥长度；64 字节 (d,z) 种子是另一种允许的存储方式。</p>')}${details('为什么隐式拒绝不能简单显示“解密失败”？','格式正确但内容无效的密文，会得到由秘密 z 和密文确定的替代 K。它不是每次重新抽取的随机值，同一私钥与相同坏密文应得到同一结果。真实解封装接口不直接暴露内部有效性位。本页能判断“与发送方不一致”，是因为课堂同时掌握双方状态，并额外计算拒绝公式做对照。错误长度属于公开格式错误，仍可被输入检查拒绝。')}${details('实现来源与验证范围','<p>使用固定版本 @noble/post-quantum 0.7.1 与 @noble/hashes 2.4.0，本地打包，无需外部 CDN。制作时对 NIST ACVP 官方固定提交的 240 个向量进行了核对，覆盖三个参数集、KeyGen、Encaps、Decaps 和输入键检查。通过这些测试不等于 NIST 认证，也不证明侧信道安全。</p><p><a href="https://github.com/paulmillr/noble-post-quantum/releases/tag/0.7.1" target="_blank" rel="noopener">算法库版本来源</a> · <a href="https://github.com/usnistgov/ACVP-Server/tree/a7f283cdc87d2d6dd93c1bac59e5622c5f9f8324/gen-val/json-files" target="_blank" rel="noopener">NIST ACVP 测试来源</a> · <a download="third-party-licenses.txt" href="data:text/plain;base64,TUwtS0VNIEludGVyYWN0aXZlIENsYXNzcm9vbSDigJQgVGhpcmQtcGFydHkgbm90aWNlcwoKCkBub2JsZS9wb3N0LXF1YW50dW0gMC43LjEKU291cmNlOiBodHRwczovL2dpdGh1Yi5jb20vcGF1bG1pbGxyL25vYmxlLXBvc3QtcXVhbnR1bQoKVGhlIE1JVCBMaWNlbnNlIChNSVQpCgpDb3B5cmlnaHQgKGMpIDIwMjQgUGF1bCBNaWxsZXIgKGh0dHBzOi8vcGF1bG1pbGxyLmNvbSkKClBlcm1pc3Npb24gaXMgaGVyZWJ5IGdyYW50ZWQsIGZyZWUgb2YgY2hhcmdlLCB0byBhbnkgcGVyc29uIG9idGFpbmluZyBhIGNvcHkKb2YgdGhpcyBzb2Z0d2FyZSBhbmQgYXNzb2NpYXRlZCBkb2N1bWVudGF0aW9uIGZpbGVzICh0aGUg4oCcU29mdHdhcmXigJ0pLCB0byBkZWFsCmluIHRoZSBTb2Z0d2FyZSB3aXRob3V0IHJlc3RyaWN0aW9uLCBpbmNsdWRpbmcgd2l0aG91dCBsaW1pdGF0aW9uIHRoZSByaWdodHMKdG8gdXNlLCBjb3B5LCBtb2RpZnksIG1lcmdlLCBwdWJsaXNoLCBkaXN0cmlidXRlLCBzdWJsaWNlbnNlLCBhbmQvb3Igc2VsbApjb3BpZXMgb2YgdGhlIFNvZnR3YXJlLCBhbmQgdG8gcGVybWl0IHBlcnNvbnMgdG8gd2hvbSB0aGUgU29mdHdhcmUgaXMKZnVybmlzaGVkIHRvIGRvIHNvLCBzdWJqZWN0IHRvIHRoZSBmb2xsb3dpbmcgY29uZGl0aW9uczoKClRoZSBhYm92ZSBjb3B5cmlnaHQgbm90aWNlIGFuZCB0aGlzIHBlcm1pc3 security:()=>`<section class="surface"><div class="lab-top"><span class="lab-title">加法分享：秘密不变，份额可以改变</span>${tag('掩码直觉 · 不构成安全实现证明',true)}</div><div class="grid-lab"><div>${slider('maskSecret','秘密 s',state.mask.secret,0,16)}${slider('maskShare','第一份分享 a',state.mask.share,0,16)}<p class="hint">另一份 b = s − a mod 17。真实分享需要合适的独立随机性；这里用滑块展示数值关系。</p></div><div id="labOutput" aria-live="polite"></div></div></section><section class="surface below"><h2>给随机源分别记三本账</h2>${table(['层次','内容','能否随意复用'],[['算法随机输入','KeyGen：d,z 共 64 B；Encaps：m 为 32 B','按规定产生新随机输入'],['确定性扩展','SHAKE / PRF 生成公开矩阵、秘密与噪声','输入顺序、域分离和采样不可改'],['防护随机性','掩码分享、刷新、转换等','受具体方案与证明条件约束']])}<div class="controls"><label for="budgetOp">操作</label><select id="budgetOp"><option value="keygen">KeyGen</option><option value="encaps">Encaps</option><option value="decaps" selected>Decaps</option></select><label for="budgetRate">次 / 秒</label><input id="budgetRate" type="number" value="${state.budget.rate}" min="1" max="1000000" step="1"><label for="budgetMask">假设每次掩码字节</label><input id="budgetMask" type="number" value="${state.budget.mask}" min="0" max="10000000" step="1"></div><div id="budgetOutput"></div><p class="hint">预算器使用您输入的“每次掩码字节数”；默认 4096 B 只是示例假设，不是 ML-KEM 的固定开销或实测值。算法输入字节数也不等于原始物理熵需求。</p></section><div class="explain"><article class="prose"><h2>恒时，不等于物理上不泄漏</h2><p>固定执行时间主要约束一部分时序行为。功耗、电磁、秘密相关存储访问、故障以及综合布线引入的毛刺，都需要进一步分析。</p><p>秘密路径并不止于 NTT：消息解码、哈希、重加密、比较、分享转换和密钥选择都要纳入威胁模型。</p></article>${note('解封装的关键区别','Decaps 算法本身不要求新的随机输入；如果实现采用掩码防护，仍可能有很高的随机带宽需求。算法中的“噪声”用于密码困难问题，不能自动替代实现掩码。')}</div>${sourceLinks()}`,
reading:()=>readingBody(),
};

function updateLab(){
 if(extra&&extra.has(state.lesson)){extra.draw(state.lesson);syncPlayer();return;}
 if(state.lesson==='overview')drawOverview();
 if(state.lesson==='noise'){drawNoise();drawMod();}
 if(state.lesson==='scalar')drawScalar();
 if(state.lesson==='polynomial')drawPoly();
 if(state.lesson==='module')drawModule();
 if(state.lesson==='compression')drawCompression();
 if(state.lesson==='ntt')drawNTT();
 if(state.lesson==='kem')drawReal();
 if(state.lesson==='security'){drawMask();drawBudget();}
 syncPlayer();
}

function drawOverview(){const n=state.steps.overview;
 const steps=[['Alice 先生成密钥对','KeyGen() → (ek,dk)','ek 可以公开，dk 留给 Alice 自己。此时 Bob 还没有共享秘密。'],['Alice 将公钥提供给 Bob','公开传输 ek','Bob 必须通过协议确认公钥归属。ML-KEM 本身不完成身份认证。'],['Bob 运行封装，得到 K 与 c','Encaps(ek) → (K,c)','封装方同时得到密钥与密文，不需要 Alice 的私钥。'],['Bob 将封装密文发回 Alice','公开传输 c','网络监听者能看到 ek 和 c，但不会直接得到 K。'],['Alice 用私钥解封装','Decaps(dk,c) → K′','正常情况下，Alice 恢复出的 K′ 与 Bob 保存的 K 相同。'],['双方用共享秘密继续建立安全通信','K′ = K','协议可以直接使用或进一步派生密钥，再用认证加密保护业务数据。']][n];
 $('labOutput').innerHTML=`<div class="handshake"><div class="actor ${[0,1,4,5].includes(n)?'active':''}"><strong>Alice</strong><div class="role">私钥持有方</div><code>ek：封装公钥</code><code>dk：仅本地保存</code>${n>=4?'<code class="msg">K′：已恢复</code>':''}</div><div class="wire"><div><div class="wire-line right">${n>=1?`<span class="packet ${n===1?'travel-right':''}">ek</span>`:''}</div><div class="wire-label">封装公钥</div></div><div><div class="wire-line left">${n>=3?`<span class="packet ${n===3?'travel-left':''}">c</span>`:''}</div><div class="wire-label">封装密文</div></div></div><div class="actor ${[2,3,5].includes(n)?'active':''}"><strong>Bob</strong><div class="role">封装方</div>${n>=1?'<code>收到 ek</code>':'<code>等待公钥</code>'}${n>=2?'<code>K：仅本地保存</code><code>c：准备发送</code>':''}</div></div><div class="step-copy"><div class="kicker">当前步骤 ${n+1}</div><h2>${steps[0]}</h2><div class="formula-box formula">${steps[1]}</div><p>${steps[2]}</p></div>${n===5?status(true,'共同得到 K；K 本身没有在网络上传输',''):''}`;
}
function clockSVG(w){let items='';for(let i=0;i<17;i++){const a=i/17*Math.PI*2-Math.PI/2,x=170+Math.cos(a)*133,y=170+Math.sin(a)*133;items+=`<circle cx="${x}" cy="${y}" r="16" fill="${i===w?'#13323a':M.decode(i)?'#e6edfd':'#e7f5ed'}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" fill="${i===w?'#fff':M.decode(i)?'#4168a3':'#24785c'}">${i}</text>`;}
 const a=w/17*Math.PI*2-Math.PI/2,x=170+Math.cos(a)*102,y=170+Math.sin(a)*102;
 return `<svg class="clock" viewBox="0 0 340 340" role="img" aria-label="模17圆周，当前落点${w}，判为比特${M.decode(w)}"><circle cx="170" cy="170" r="113" fill="none" stroke="#e0e8ec" stroke-width="1"/>${items}<line x1="170" y1="170" x2="${x}" y2="${y}" stroke="#1b726b" stroke-width="2"/><circle cx="170" cy="170" r="5" fill="#1b726b"/><rect x="110" y="182" width="120" height="55" rx="8" fill="white"/><text x="170" y="209" font-size="25" text-anchor="middle" fill="#123b42">w = ${w}</text><text x="170" y="231" font-size="12" text-anchor="middle" fill="#596a75">${M.center(w)} mod 17</text></svg>`;
}
function drawNoise(){let {m,e}=state.noise,mu=M.encode(m),w=M.mod(mu+e),d=M.decode(w);$('noiseNumbers').innerHTML=`<div class="formula-box formula">μ = ${mu}<br>w = (${mu} ${e>=0?'+':'−'} ${Math.abs(e)}) mod 17 = ${w}</div>${status(d===m,`恢复 ${d}，与原比特一致`,`恢复 ${d}，原比特是 ${m}：跨过判决边界`)}<p class="small muted">round(2 × ${w} / 17) mod 2 = ${d}</p>`;$('labOutput').innerHTML=clockSVG(w)+`<div class="noise-grid" aria-hidden="true">${Array.from({length:17},(_,i)=>`<span class="${M.decode(i)?'one ':''}${i===w?'selected':''}">${i}</span>`).join('')}</div><p class="hint" style="text-align:center">浅绿色判为 0 · 浅蓝色判为 1 · 深色为当前落点</p>`;document.querySelectorAll('[data-act="noise-bit"]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.value===m)));}
function drawMod(){let x=state.noise.x,k=Math.floor(x/17),r=M.mod(x);$('modResult').textContent=`${x} = 17 × (${k}) + ${r}，所以结果是 ${r}`;}
function drawScalar(){const p=M.scalar(state.scalar),n=state.steps.scalar,steps=[
 ['准备输入','公钥结构 a，秘密 s，小随机量与消息位。',`a = ${p.a}，s = ${p.s}，e = ${p.e}<br>r = ${p.r}，e₁ = ${p.e1}，e₂ = ${p.e2}，m = ${p.m}`],
 ['计算公钥 t','公开的是带噪声的关系，s 保密。',`t = as + e = ${p.a} × (${p.s}) + (${p.e})<br>= ${p.a*p.s+p.e} ≡ <strong>${p.t}</strong> (mod 17)`],
 ['编码消息','把比特放到相隔较远的两个编码位置。',`μ(${p.m}) = <span class="msg">${p.mu}</span>`],
 ['计算密文的第一部分 u','u 携带能被秘密 s 利用的结构。',`u = ar + e₁ = ${p.a} × (${p.r}) + (${p.e1})<br>= ${p.a*p.r+p.e1} ≡ <strong>${p.u}</strong> (mod 17)`],

function readingBody(){
 const qs=[['为什么不能把公钥噪声 e 去掉来提速？','去掉噪声，关系退化成精确线性方程。在满足相应可逆或秩条件时，可通过线性代数恢复秘密；无法继续依赖原来的 Module-LWE 困难性。不是所有带噪声问题都安全，参数和分布也至关重要。'],['为何模 17 的 w = 15 判为 0？','15 等于 −2，模圆周上靠近 0。精确计算 round(2 × 15 / 17) mod 2 = 2 mod 2 = 0。判断不能用普通整数数轴的距离代替标准舍入。'],['为什么加密用 Aᵀ，而不是 A？','因为定义了 t = As + e。要使 (As)ᵀr 与 sᵀu 中的大项相同，u 必须含 Aᵀr。换一种矩阵定义可以改写符号，但不能在同一套定义中漏掉转置。'],['压缩强一点，某次计算反而成功，是否矛盾？','不矛盾。单个样本的误差可以抵消，失败与否未必随压缩精度单调变化。总体失败概率需要完整分布分析，不能用几个样本推断。'],['为什么恢复 m′ 后，还必须重加密比较？','重新生成 c′ 用于验证恢复消息、公钥和派生随机性的一致关系，是抵抗选择密文攻击的重要机制。不能把“内部公钥解密能运行”当成完整 KEM 安全性。'],['解封装一个坏密文，两次结果为什么一样？','隐式拒绝返回 J(z ∥ c)。同一秘密 z 和同一密文 c 会得到同一个结果；它不是每次重新从随机源抽取 32 字节。'],['通过功能向量、运行恒时，是否就足够安全？','不够。功能正确与部分时序行为只是证据的一部分；功耗、电磁、故障、随机数、分享转换及综合布线后的实际泄漏仍需分析。'],['ML-KEM 与数字签名、对称加密各负责什么？','ML-KEM 用于建立共享秘密；数字签名（如 ML-DSA）用于签名验证与身份相关认证机制；对称认证加密保护业务数据。三者应由适当协议组合。']];
 return `<section class="surface"><h2>八个问题，检查是否真的理解</h2>${qs.map(([q,a],i)=>details(`${String(i+1).padStart(2,'0')} · ${q}`,a)).join('')}</section><section class="surface below"><h2>核心公式放在一起看</h2><div class="formula-box formula">t = As + e<br>u = Aᵀr + e₁<br>v = tᵀr + e₂ + μ<br>w = v − sᵀu = μ + eᵀr + e₂ − sᵀe₁<br>压缩后追加：δᵥ − sᵀδᵤ</div><p class="small">这些是多项式系数表示中的解释。实际标准会在字节表示、系数表示和 NTT 表示之间转换，且公钥 t̂、私钥核心 ŝ 使用 NTT 表示。</p>${table(['符号','含义','注意'],[['A / ρ','公开矩阵 / 公开种子','Â 由 ρ 在 NTT 表示下展开'],['s、e','秘密向量、公钥噪声','按指定分布产生'],['r、e₁、e₂','本次临时向量与噪声','由 r_seed 派生；不是独立随便选值'],['m / μ','内部随机消息 / 编码多项式','m 为 32 字节，μ 含 256 个系数'],['ek / dk','封装公钥 / 解封装私钥','输入检查不等于身份认证'],['H / G / J','SHA3-256 / SHA3-512 / SHAKE256','J 输出 32 字节'],['K','共享秘密','三组参数都输出 32 字节']])}</section><section class="surface below"><h2>三组参数的标准大小</h2>${table(['参数集','NIST 类别','公钥','展开私钥','密文'],[['ML-KEM-512','1','800 B','1632 B','768 B'],['ML-KEM-768','3','1184 B','2400 B','1088 B'],['ML-KEM-1024','5','1568 B','3168 B','1568 B']])}<p class="small">NIST 在 FIPS 203 推荐 ML-KEM-768 作为默认参数集；具体选择仍受安全目标、性能和适用协议约束。类别 1/3/5 不是“量子安全 128/192/256 位”的精确换算。</p></section><section class="surface below"><h2>继续阅读原始资料</h2><ol class="source-list"><li><a href="https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.203.pdf" target="_blank" rel="noopener">NIST FIPS 203 正式标准</a>：§4 算术、采样与 NTT；§5 内层 K-PKE；§6–7 完整 ML-KEM；§8 参数；附录 C 与旧 Kyber 的差异。</li><li><a href="https://csrc.nist.gov/pubs/sp/800/227/final" target="_blank" rel="noopener">NIST SP 800-227</a>：KEM 的安全使用、认证、密钥确认、上下文和混合组合。</li><li><a href="https://csrc.nist.gov/Projects/post-quantum-cryptography/faqs" target="_blank" rel="noopener">NIST 官方 FAQ</a> 与 <a href="https://csrc.nist.gov/pubs/fips/203/final" target="_blank" rel="noopener">FIPS 发布页</a>：实施前复核最新澄清和勘误；种子形式与展开私钥长度要区分。</li><li><a href="https://pq-crystals.org/kyber/data/kyber-specification-round3-20210804.pdf" target="_blank" rel="noopener">Kyber v3.02 设计规范</a>：用于理解背景，不可代替最终 ML-KEM 的伪代码与测试向量。</li><li><a href="https://github.com/paulmillr/noble-post-quantum/releases/tag/0.7.1" target="_blank" rel="noopener">课堂实际算法库</a>：@noble/post-quantum 0.7.1；<a download="third-party-licenses.txt" href="data:text/plain;base64,TUwtS0VNIEludGVyYWN0aXZlIENsYXNzcm9vbSDigJQgVGhpcmQtcGFydHkgbm90aWNlcwoKCkBub2JsZS9wb3N0LXF1YW50dW0gMC43LjEKU291cmNlOiBodHRwczovL2dpdGh1Yi5jb20vcGF1bG1pbGxyL25vYmxlLXBvc3QtcXVhbnR1bQoKVGhlIE1JVCBMaWNlbnNlIChNSVQpCgpDb3B5cmlnaHQgKGMpIDIwMjQgUGF1bCBNaWxsZXIgKGh0dHBzOi8vcGF1bG1pbGxyLmNvbSkKClBlcm1pc3Npb24gaXMgaGVyZWJ5IGdyYW50ZWQsIGZyZWUgb2YgY2hhcmdlLCB0byBhbnkgcGVyc29uIG9idGFpbmluZyBhIGNvcHkKb2YgdGhpcyBzb2Z0d2FyZSBhbmQgYXNzb2NpYXRlZCBkb2N1bWVudGF0aW9uIGZpbGVzICh0aGUg4oCcU29mdHdhcmXigJ0pLCB0byBkZWFsCmluIHRoZSBTb2Z0d2FyZSB3aXRob3V0IHJlc3RyaWN0aW9uLCBpbmNsdWRpbmcgd2l0aG91dCBsaW1pdGF0aW9uIHRoZSByaWdodHMKdG8gdXNlLCBjb3B5LCBtb2RpZnksIG1lcmdlLCBwdWJsaXNoLCBkaXN0cmlidXRlLCBzdWJsaWNlbnNlLCBhbmQvb3Igc2VsbApjb3BpZXMgb2YgdGhlIFNvZnR3YXJlLCBhbmQgdG8gcGVybWl0IHBlcnNvbnMgdG8gd2hvbSB0aGUgU29mdHdhcmUgaXMKZnVybmlzaGVkIHRvIGRvIHNvLCBzdWJqZWN0IHRvIHRoZSBmb2xsb3dpbmcgY29uZGl0aW9uczoKClRoZSBhYm92ZSBjb3B5cmlnaHQgbm90aWNlIGFuZCB0aGlzIHBlcm1pc3Npb24gbm90aWNlIHNoYWxsIGJlIGluY2x1ZGVkIGluCmFsbCBjb3BpZXMgb3Igc3Vic3RhbnRpYWwgcG9ydGlvbnMgb2YgdGhlIFNvZnR3YXJlLgoKVEhFIFNPRlRXQVJFIElTIFBST1ZJREVEIOKAnEFTIElT4oCdLCBXSVRIT1VUIFdBUlJBTlRZIE9GIEFOWSBLSU5ELCBFWFBSRVNTIE9SCklNUExJRUQsIElOQ0xVRElORyBCVVQgTk9UIExJTUlURUQgVE8gVEhFIFdBUlJBTlRJRVMgT0YgTUVSQ0hBTlRBQklMSVRZLApGSVRORVNTIEZPUiBBIFBBUlRJQ1VMQVIgUFVSUE9TRSBBTkQgTk9OSU5GUklOR0VNRU5ULiBJTiBOTyBFVkVOVCBTSEFMTCBUSEUKQVVUSE9SUyBPUiBDT1BZUklHSFQgSE9MREVSUyBCRSBMSUFCTEUgRk9SIEFOWSBDTEFJTSwgREFNQUdFUyBPUiBPVEhFUgpMSUFCSUxJVFksIFdIRVRIRVIgSU4gQU4gQUNUSU9OIE9GIENPTlRSQUNULCBUT1JUIE9SIE9USEVSV0lTRSwgQVJJU0lORyBGUk9NLApPVVQgT0YgT1IgSU4gQ09OTkVDVElPTiBXSVRIIFRIRSBTT0ZUV0FSRSBPUiBUSEUgVVNFIE9SIE9USEVSIERFQUxJTkdTIElOClRIRSBTT0ZUV0FSRS4KCkBub2JsZS9oYXNoZXMgMi40LjAKU291cmNlOiBodHRwczovL2dpdGh1Yi5jb20vcGF1bG1pbGxyL25vYmxlLWhhc2hlcwoKVGhlIE1JVCBMaWNlbnNlIChNSVQpCgpDb3B5cmlnaHQgKGMpIDIwMjIgUG document.addEventListener('click',event=>{if(event.target.closest('.skip')){event.preventDefault();$('lesson').focus();return;}const b=event.target.closest('button[data-act]');if(!b||b.disabled)return;const invalid=document.querySelector('input[aria-invalid="true"]');if(invalid){invalid.reportValidity();return;}const act=b.dataset.act;try{
 if(extra.click(act,b)){syncPlayer();return;}
 if(act==='prev')setStep(state.steps[state.lesson]-1);if(act==='next')setStep(state.steps[state.lesson]+1);if(act==='play')play();if(act==='reset')setStep(0);
 if(act==='noise-bit'){state.noise.m=+b.dataset.value;drawNoise();}
 if(act==='noise-example'){state.noise.e=+b.dataset.value;$('noiseAmount').value=state.noise.e;$('noiseAmountVal').value=state.noise.e;drawNoise();}
 if(act==='module-bit'){let i=+b.dataset.value;state.module.m[i]^=1;b.textContent=state.module.m[i];b.setAttribute('aria-label',`切换消息第${i}位，当前为${state.module.m[i]}`);stop();drawModule();}
 if(act==='compress-preset'){state.compression={x:+b.dataset.x,d:+b.dataset.d};$('compressX').value=state.compression.x;$('compressD').value=state.compression.d;$('compressXVal').value=state.compression.x;$('compressDVal').value=state.compression.d;drawCompression();}
 if(act==='ntt-direction'){stop();state.ntt.direction=state.ntt.direction==='forward'?'inverse':'forward';state.steps.ntt=0;drawNTT();syncPlayer();}
 if(act.startsWith('real-')){
  state.real.error='';if(!C)throw new Error('算法模块未成功加载，请重新打开完整网页。');
  if(act==='real-keygen')realKeygen();if(act==='real-encaps')realEncaps();if(act==='real-decaps')realDecaps();
  if(act==='real-all'){realKeygen();realEncaps();realDecaps();}
  if(act==='real-reset')resetReal();if(act==='real-tamper')realTamper();
  if(act==='real-restore'){state.real.tampered=null;state.real.scenario='normal';realDecaps();}
  if(act==='real-malformed'){const r=state.real;r.tampered=null;r.scenario='malformed';try{C.algorithms[r.level].decapsulate(r.enc.cipherText.slice(1),r.kp.secretKey);r.lengthError='未按预期拒绝，请检查实现。';}catch(e){r.lengthError=e.message;}}
  drawReal();
 }
 }catch(e){if(state.lesson==='kem'){state.real.error=e.message;drawReal();}else{console.error(e);}}
});
function validNumber(el){if(el.value==='')return null;const n=Number(el.value);if(!Number.isFinite(n)||!Number.isInteger(n))return null;const min=Number(el.min),max=Number(el.max);if(n<min||n>max)return null;return n;}
function syncValidation(){const invalid=document.querySelector('input[aria-invalid="true"]'),warning=$('inputWarning');if(warning){warning.hidden=!invalid;warning.textContent=invalid?'请修正输入：请输入 '+invalid.min+'～'+invalid.max+' 范围内的整数。计算暂时保留上一次有效结果。':'';}}
function onInput(e){const el=e.target,id=el.id;if(!id)return;let v=validNumber(el);if(el.type==='number'&&v===null){stop();el.setCustomValidity('请输入范围内的整数。');el.setAttribute('aria-invalid','true');syncValidation();return;}if(el.type==='number'){el.setCustomValidity('');el.removeAttribute('aria-invalid');syncValidation();}
 if(id==='noiseAmount'){state.noise.e=+el.value;$('noiseAmountVal').value=el.value;drawNoise();}
 if(id==='modInput'){state.noise.x=v;drawMod();}
 if(id.startsWith('scalar-')){state.presets.scalar='custom';$('scalarPreset').value='custom';state.scalar[id.slice(7)]=v;stop();state.steps.scalar=0;drawScalar();syncPlayer();}
 if(id.startsWith('poly-')){state.presets.poly='custom';$('polyPreset').value='custom';const [,which,index]=id.split('-');state.poly[which][+index]=v;stop();state.steps.polynomial=0;drawPoly();syncPlayer();}
 if(id==='compressX'||id==='compressD'){state.compression[id==='compressX'?'x':'d']=+el.value;$(id+'Val').value=el.value;drawCompression();}
 if(id==='maskSecret'||id==='maskShare'){state.mask[id==='maskSecret'?'secret':'share']=+el.value;$(id+'Val').value=el.value;drawMask();}
 if(id==='budgetRate'||id==='budgetMask'){state.budget[id==='budgetRate'?'rate':'mask']=v;drawBudget();}
 if(id==='tamperOffset')state.real.offset=v;
 extra.input(id,v,el);
}
document.addEventListener('input',onInput);
document.addEventListener('change',e=>{const el=e.target,id=el.id,v=el.value;
 if(id==='mobileNav'){location.hash=v;return;}
 if(id==='speed'){const was=state.playing;stop();state.speed=+v;if(was)play();return;}
 if(id==='scalarPreset'){if(v==='custom')return;state.presets.scalar=v;const presets={original:{...scalarDefaults},zero:{...scalarDefaults,m:0},edge:{...scalarDefaults,e2:4},fail:{...scalarDefaults,e2:5}};state.scalar=presets[v];stop();state.steps.scalar=0;Object.entries(state.scalar).forEach(([k,val])=>{$('scalar-'+k).value=val;$('scalar-'+k).setCustomValidity('');$('scalar-'+k).removeAttribute('aria-invalid');});drawScalar();syncPlayer();syncValidation();}
 if(id==='polyPreset'){if(v==='custom')return;state.presets.poly=v;const presets={hand:{a:[1,2,0,0],b:[3,1,0,0]},fold:{a:[1,0,0,1],b:[1,1,0,0]},single:{a:[0,0,0,1],b:[0,0,1,0]},dense:{a:[3,1,4,1],b:[1,-1,0,1]}};state.poly=presets[v];stop();state.steps.polynomial=0;for(const k of ['a','b'])state.poly[k].forEach((val,i)=>{$('poly-'+k+'-'+i).value=val;$('poly-'+k+'-'+i).setCustomValidity('');$('poly-'+k+'-'+i).removeAttribute('aria-invalid');});drawPoly();syncPlayer();syncValidation();}
 if(id==='moduleCompression'){state.module.mode=v;stop();drawModule();}
 if(id==='nttPreset'){state.presets.ntt=v;state.ntt.input={ramp:[1,2,3,4,5,6,7,8],impulse:[1,0,0,0,0,0,0,0],pair:[1,1,0,0,0,0,0,0]}[v];state.ntt.direction='forward';stop();state.steps.ntt=0;drawNTT();syncPlayer();}
 if(id==='realLevel'||id==='realMode'){if(id==='realLevel')state.real.level=+v;else state.real.mode=v;resetReal();drawReal();}
 if(id==='tamperBit')state.real.bit=+v;
 if(id==='budgetOp'){state.budget.op=v;drawBudget();}
 extra.change(id,v,el);syncValidation();syncPlayer();
});
window.addEventListener('hashchange',()=>{navigate();window.scrollTo({top:0,behavior:'instant'});});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
extra=globalThis.CourseExtra.create({M,$,state,player,table,note,details,status,slider,num,array,vec,poly,facts,stop,setStep,syncPlayer,sourceLinks});
navigate();
})();
